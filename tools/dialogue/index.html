<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5.clickery dialogue previewer</title>
  <link rel="stylesheet" href="../shared/app.css">
  <style>
    html, body { height: 100%; }
    body.app { display: flex; flex-direction: column; }
    main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
    textarea { width: 100%; height: 100%; resize: none; border: 0; border-right: 1px solid var(--line); border-radius: 0; padding: 12px; tab-size: 2; }
    section { overflow: auto; padding: 12px 16px; }
    #status { padding: 6px 10px; border-radius: 6px; background: var(--ok-bg); }
    #status.error { background: var(--err-bg); color: var(--err-ink); white-space: pre-wrap; }
    .line { margin: 4px 0; } .line b { color: var(--warm); } .line .tag { font-size: 11px; color: var(--good); border: 1px solid var(--good); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
    .choice-said { margin: 4px 0; color: var(--you); }
    #options { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; align-items: flex-start; }
    #options button { text-align: left; background: var(--row-on); border-color: var(--accent); }
    .end { color: var(--muted); font-style: italic; margin-top: 8px; }
    table { border-collapse: collapse; } td, th { text-align: left; padding: 2px 14px 2px 0; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .warn { color: var(--warm); }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 45% 55%; } textarea { border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body class="app">
  <header>
    <h1>Dialogue previewer</h1>
    <button id="open">Open file…</button>
    <input id="file" type="file" accept=".md,.txt,.twee,.tw,.json" hidden>
    <button id="sample-md">Markdown sample</button>
    <button id="sample-twee">Twine sample</button>
    <label>Start at <select id="start"></select></label>
    <label>Variables <input id="vars" size="22" value="{}" spellcheck="false" title='Starting values as JSON, for example {"gold": 7}'></label>
    <button id="restart">Restart</button>
  </header>
  <main>
    <textarea id="source" spellcheck="false" aria-label="Conversation"></textarea>
    <section>
      <div id="status"></div>
      <h2>Conversation</h2>
      <div id="transcript"></div>
      <div id="options"></div>
      <div id="end" class="end" hidden>The conversation is over.</div>
      <h2>Variables</h2>
      <div id="variables"></div>
      <h2>Checks</h2>
      <div id="checks"></div>
      <p class="muted">Plays Markdown, Twee 3 and Twison. For Ink, compile with tools/compile-ink.mjs and play it with game.talk.</p>
    </section>
  </main>
  <script type="module" src="preview.js"></script>
</body>
</html>
