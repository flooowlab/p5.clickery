<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5.clickery animation previewer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #15171c; color: #dfe2ea; font: 14px/1.5 system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; background: #1f222b; border-bottom: 1px solid #333844; }
    header h1 { font-size: 15px; margin: 0 8px 0 0; }
    label { display: inline-flex; align-items: center; gap: 6px; color: #9aa1b2; }
    button, select, input { font: inherit; color: inherit; background: #2b2f3a; border: 1px solid #434a5a; border-radius: 4px; padding: 4px 8px; }
    button { cursor: pointer; } button:hover { background: #363c4b; }
    input[type=number] { width: 72px; } input[type=checkbox] { padding: 0; }
    main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 12px; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8f98ad; margin: 16px 0 6px; }
    h2:first-child { margin-top: 0; }
    canvas { display: block; background: #0d0f13; border: 1px solid #333844; border-radius: 6px; image-rendering: pixelated; max-width: 100%; }
    #sheet { cursor: crosshair; }
    .rows { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .row input[type=text] { width: 120px; } .row input.frames { width: 130px; }
    .bad { border-color: #c0392b !important; }
    #warnings div { color: #ffd678; } #warnings .ok { color: #7fd6a8; }
    .dirs { display: grid; grid-template-columns: repeat(3, 38px); gap: 3px; margin: 6px 0; }
    .dirs button { padding: 2px 0; } .dirs button.on { background: #3b5bdb; border-color: #6c9bff; }
    textarea { width: 100%; height: 280px; background: #181b22; color: #dfe2ea; border: 1px solid #333844; border-radius: 6px; padding: 10px; font: 12px/1.5 ui-monospace, Consolas, monospace; resize: vertical; }
    .muted { color: #8f98ad; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Animation previewer</h1>
    <button id="open">Open sprite sheet…</button>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="sample">Sample sheet</button>
    <label>Frame width <input id="fw" type="number" min="1" value="64"></label>
    <label>height <input id="fh" type="number" min="1" value="64"></label>
    <span id="grid" class="muted"></span>
  </header>
  <main>
    <div>
      <h2>Sprite sheet <span class="muted">(frame numbers count left to right, top to bottom)</span></h2>
      <canvas id="sheet" width="560" height="300"></canvas>
      <h2>Animations</h2>
      <div id="rows" class="rows"></div>
      <p><button id="add">Add animation</button> <span class="muted">Names: idle, walk, talk, optionally with _up, _right, _down or _left. A missing direction uses the mirror image.</span></p>
      <div id="warnings"></div>
    </div>
    <div>
      <h2>Preview</h2>
      <canvas id="preview" width="192" height="192"></canvas>
      <div class="row">
        <label>State <select id="state"><option>idle</option><option>walk</option><option>talk</option></select></label>
        <label>Directions <select id="directions"><option value="4">4</option><option value="8">8</option></select></label>
      </div>
      <div class="dirs" id="dirs"></div>
      <div id="using" class="muted"></div>
      <h2>Code for your game</h2>
      <textarea id="code" readonly spellcheck="false"></textarea>
      <p><button id="copy">Copy code</button></p>
    </div>
  </main>
  <script type="module" src="preview.js"></script>
</body>
</html>
