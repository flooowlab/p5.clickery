<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5.clickery puzzle demo</title>
  <style>
    body { margin: 0; background: #111; color: #ddd; font-family: sans-serif; }
    #game { display: flex; justify-content: center; padding: 16px; }
    #game canvas { max-width: 100%; height: auto; touch-action: none; }
    p { text-align: center; margin: 4px; padding: 0 12px; }
  </style>
  <script src="node_modules/p5/lib/p5.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <p>Pick up the stick and the string, combine them (tap one in the bar, then the other), and fish the key out of the grate with the pole.
     Mouse: click to act, right-click or hold to look. Touch: tap once to highlight, again to act, hold to look. D toggles debug.</p>
  <script type="module">
    import {
      registerClickery, createCore, SceneManager, HoverTracker, createHotspots, clientToLogical, Navigator, Actor,
      Inventory, Interactor, PointerController, InventoryBar, hoverLabel, defaultStrings, applyHotspotState,
      sortByBaseline, drawBackground, drawFade, drawDebugOverlay, drawHoverLabel,
    } from './src/index.js';

    registerClickery(p5);
    const VIEW_W = 640, VIEW_H = 360;

    const core = createCore();
    core.i18n.add('en', {
      ...defaultStrings,
      'item.stick': 'stick', 'item.string': 'string', 'item.pole': 'fishing pole', 'item.key': 'brass key',
      'obj.stick': 'Stick', 'obj.string': 'Ball of string', 'obj.grate': 'Drain grate', 'obj.door': 'Door',
      'stick.get': 'A sturdy stick.', 'stick.look': 'It is a stick.',
      'string.get': 'Some string. Handy.', 'string.look': 'A ball of string.',
      'grate.look': 'Something shiny is down there, out of reach.',
      'grate.fish': 'Got it! A brass key.',
      'grate.reach': "I can't reach it with my hands.",
      'pole.made': 'A fishing pole. Not bad.',
      'door.look': 'A heavy door.', 'door.locked': "It's locked.", 'door.open': 'The key fits. Well done!',
    });
    core.state.set('currentRoom', 'yard');

    const room = {
      id: 'yard', width: VIEW_W, height: VIEW_H, color: '#2d3a55',
      starts: { default: { x: 60, y: 300 } },
      walkable: [{ id: 'floor', points: [[0, 240], [640, 240], [640, 300], [0, 300]], scale: [[240, 0.6], [300, 1]] }],
      obstacles: [],
      hotspots: [
        { id: 'stick', name: 'obj.stick', provider: 'polygon', points: [[110, 255], [160, 255], [160, 270], [110, 270]], walkTo: { x: 135, y: 285, dir: 'up' } },
        { id: 'string', name: 'obj.string', provider: 'polygon', points: [[260, 255], [290, 255], [290, 280], [260, 280]], walkTo: { x: 275, y: 295, dir: 'up' } },
        { id: 'grate', name: 'obj.grate', provider: 'polygon', points: [[400, 250], [470, 250], [470, 280], [400, 280]], walkTo: { x: 435, y: 295, dir: 'up' } },
        { id: 'door', name: 'obj.door', provider: 'polygon', points: [[560, 110], [620, 110], [620, 240], [560, 240]], walkTo: { x: 590, y: 270, dir: 'up' } },
      ],
    };
    const scene = new SceneManager({ ...core, viewWidth: VIEW_W, viewHeight: VIEW_H, loadRoom: async () => room, fadeMs: 300 });

    const hero = new Actor({ id: 'hero', speed: 150, directions: 4, translate: (k, v) => core.i18n.t(k, v) });
    const hover = new HoverTracker(core.events);
    const inventory = new Inventory({
      state: core.state, events: core.events,
      items: { stick: { name: 'item.stick' }, string: { name: 'item.string' }, pole: { name: 'item.pole' }, key: { name: 'item.key' } },
      recipes: [{ a: 'stick', b: 'string', result: 'pole', say: 'pole.made' }],
    });
    const interactor = new Interactor({ hero, state: core.state, events: core.events, inventory, hover });
    const bar = new InventoryBar({ viewWidth: VIEW_W, viewHeight: VIEW_H });
    const pointer = new PointerController({ interactor, hover, camera: scene.camera, bar, scheduler: core.scheduler });

    // Scripts, one set per object id.
    const pickUp = (item, key) => ({
      async onInteract(c) { c.inventory.give(item); c.setEnabled(item, false); await c.say(key); },
      onLook: (c) => c.say(`${item}.look`),
    });
    interactor.register('stick', pickUp('stick', 'stick.get'));
    interactor.register('string', pickUp('string', 'string.get'));
    interactor.register('grate', {
      onLook: (c) => c.say('grate.look'),
      onInteract: (c) => c.say('grate.reach'),
      async onUse(c) {
        if (c.item !== 'pole') return false;
        c.inventory.remove('pole');
        c.inventory.give('key');
        await c.say('grate.fish');
      },
    });
    interactor.register('door', {
      onLook: (c) => c.say('door.look'),
      async onInteract(c) { await c.say('door.locked'); },
      async onUse(c) {
        if (c.item !== 'key') return false;
        c.inventory.remove('key');
        c.state.set('flags.doorOpen', true);
        await c.say('door.open');
      },
    });

    core.events.on('room:enter', ({ room: r }) => {
      const hotspots = createHotspots(r);
      applyHotspotState(core.state, r.id, hotspots);
      hover.setHotspots(hotspots);
      hero.navigator = Navigator.fromRoom(r);
      hero.teleport(r.starts.default.x, r.starts.default.y);
    });
    core.events.on('update', (dt) => hero.update(dt));
    core.loop.start();
    scene.goTo('yard');
    window.demo = { core, scene, hero, hover, interactor, inventory, pointer }; // for poking at it from the console

    let debug = false;
    const rectOf = (id) => { const pts = room.hotspots.find((h) => h.id === id).points; return [pts[0][0], pts[0][1], pts[2][0] - pts[0][0], pts[2][1] - pts[0][1]]; };

    const sketch = (p) => {
      p.setup = () => {
        const canvas = p.createGameCanvas(VIEW_W, VIEW_H);
        const el = canvas.elt;
        const at = (e) => clientToLogical(e.clientX, e.clientY, el.getBoundingClientRect(), VIEW_W, VIEW_H);
        el.addEventListener('contextmenu', (e) => e.preventDefault());
        el.addEventListener('pointermove', (e) => pointer.move(at(e)));
        el.addEventListener('pointerleave', () => pointer.leave());
        el.addEventListener('pointerdown', (e) => { if (!scene.busy) pointer.down({ ...at(e), pointerType: e.pointerType, button: e.button }); });
        el.addEventListener('pointerup', (e) => pointer.up(at(e)));
        el.addEventListener('pointercancel', () => pointer.cancel());
      };
      p.keyPressed = () => { if (p.key === 'd' || p.key === 'D') debug = !debug; };

      p.draw = () => {
        const r = scene.room;
        if (!r) return;
        drawBackground(p, r, scene.camera);
        p.noStroke();
        p.fill(60, 70, 90);
        p.rect(0, 240, VIEW_W, 120);
        const open = core.state.get('flags.doorOpen', false);
        p.fill(open ? p.color(20) : p.color(150, 100, 60));
        p.rect(...rectOf('door'));
        if (core.state.get('rooms.yard.hotspots.stick.enabled', true)) { p.fill(140, 100, 50); p.rect(...rectOf('stick')); }
        if (core.state.get('rooms.yard.hotspots.string.enabled', true)) { p.fill(220, 220, 200); p.ellipse(275, 268, 28, 24); }
        p.fill(40); p.rect(...rectOf('grate'));
        if (!inventory.has('key') && !open) { p.fill(230, 200, 60); p.rect(430, 262, 10, 6); }

        const s = hero.scale;
        p.fill(240, 120, 90);
        p.rect(hero.x - 14 * s, hero.y - 70 * s, 28 * s, 70 * s, 6);

        if (hero.speech) {
          p.textSize(16); p.textAlign(p.CENTER, p.BOTTOM);
          const x = Math.min(Math.max(hero.x, 150), VIEW_W - 150);
          p.fill(0); p.text(hero.speech.text, x + 1, hero.y - 80 * s + 1);
          p.fill(255, 240, 160); p.text(hero.speech.text, x, hero.y - 80 * s);
        }

        const items = inventory.list;
        bar.draw(p, items, interactor.held);
        if (open) { p.fill(255); p.textSize(20); p.textAlign(p.CENTER, p.CENTER); p.text('You escaped!', VIEW_W / 2, 60); }

        const pos = pointer.pointer;
        const label = hoverLabel({
          hotspot: pointer.highlighted ?? hover.hovered, item: pointer.hoveredItem, held: interactor.held,
          inventory, mode: interactor.mode, verb: interactor.verb, t: (k, v) => core.i18n.t(k, v),
        });
        if (pos) drawHoverLabel(p, label, pos.x, pos.y);
        if (debug) drawDebugOverlay(p, { hotspots: hover.hotspots, room: r, camera: scene.camera, hovered: hover.hovered });
        drawFade(p, scene.fade);
      };
    };

    new p5(sketch, document.getElementById('game'));
  </script>
</body>
</html>
