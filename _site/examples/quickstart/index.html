<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5.clickery quick start</title>
  <script src="../../node_modules/p5/lib/p5.min.js"></script>
  <script src="../../dist/p5.clickery.min.js"></script>
</head>
<body>
  <script>
    let game;

    async function setup() {
      game = createGame({
        // A room is plain data: its size, where the hero starts, the floor, and what can be clicked.
        rooms: [{
          id: 'yard', width: 640, height: 360, color: '#2d3a55',
          starts: { default: { x: 80, y: 300 } },
          walkable: [{ id: 'floor', points: [[0, 250], [640, 250], [640, 340], [0, 340]], color: '#3c4659' }],
          hotspots: [{
            id: 'sign', name: 'obj.sign', provider: 'polygon', color: '#96643c',
            points: [[300, 170], [380, 170], [380, 250], [300, 250]],
            walkTo: { x: 340, y: 290, dir: 'up' },
          }],
        }],
        // Everything the player reads is a text key.
        strings: {
          'obj.sign': 'Wooden sign',
          'sign.look': 'It says: "Welcome to p5.clickery!"',
          'sign.use': 'I could read it again, but I will not.',
        },
      });

      // What happens when the player looks at (right-click) or uses (click) the sign.
      game.on('sign', {
        onLook: (ctx) => ctx.say('sign.look'),
        onInteract: (ctx) => ctx.say('sign.use'),
      });

      await game.start();
    }

    function draw() {
      game.draw();
    }
  </script>
</body>
</html>
