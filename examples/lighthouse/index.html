<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Lighthouse (p5.clickery example)</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #0b0d12; color: #cfd3dc; font: 14px system-ui, sans-serif; overflow: hidden; }
    #stage { flex: 1; min-height: 0; background: #000; }
    #bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 6px 12px; }
    #bar button { font: inherit; color: inherit; background: #222735; border: 1px solid #3a4152; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
    #bar span { opacity: .7; }
  </style>
  <script src="../../node_modules/p5/lib/p5.min.js"></script>
</head>
<body>
  <div id="stage"></div>
  <div id="bar">
    <button id="save">Save</button><button id="load">Load</button><span id="msg"></span>
    <span>Click to act, right-click or hold to look. Tap once to highlight and again to act on touch. Esc skips the ending.</span>
  </div>
  <!-- This example is organised as a project with ES modules: the game's logic is in
       game.js and scripts/, and this page only adds p5 and the drawing details. -->
  <script type="module">
    import { Story } from '../../node_modules/inkjs/dist/ink.mjs';
    import { registerClickery, attachP5, drawRoomShapes } from '../../src/index.js';
    import { createLighthouse } from './game.js';

    registerClickery(p5);
    const $ = (id) => document.getElementById(id);
    const here = (path) => new URL(path, import.meta.url);
    const sound = (name) => here(`../assets/audio/${name}.wav`).href;

    const game = await createLighthouse({
      loadJson: async (path) => (await fetch(here(path))).json(),
      loadText: async (path) => (await fetch(here(path))).text(),
      Story,
      sounds: { 'music-dock': sound('music-yard'), 'music-hall': sound('music-cellar'), pickup: sound('pickup'), bell: sound('alarm') },
    });
    window.game = game;

    const say = (text) => { $('msg').textContent = text; setTimeout(() => { if ($('msg').textContent === text) $('msg').textContent = ''; }, 2000); };
    $('save').onclick = () => { game.save(); say('Saved.'); };
    $('load').onclick = async () => say((await game.load()) ? 'Loaded.' : 'Nothing saved yet.');

    new p5((p) => {
      p.setup = async () => {
        attachP5(game, p); // canvas, input, scaling to #stage, and game.draw()

        // The default room drawing fills the shapes that have a "color" in the room files;
        // add the lamp's glow and the ship at the end on top of it.
        game.drawRoom = (p, room) => {
          drawRoomShapes(p, room, game);
          if (room.id !== 'lamp-room') return;
          p.noStroke();
          if (game.flag('lampLit')) {
            p.fill('#ffd96a'); p.rect(280, 100, 80, 150);
            p.fill(255, 217, 106, 40); p.rect(0, 0, 640, 360);
          }
          if (game.flag('ending')) { p.fill(240); p.triangle(520, 170, 545, 170, 532, 150); p.rect(510, 170, 45, 8); }
        };

        await game.start();
      };
      p.draw = () => game.draw();
    }, $('stage'));
  </script>
</body>
</html>
